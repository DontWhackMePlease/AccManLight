<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c6fb7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Accounts">
<title>Account Manager Light</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --blue: #2c6fb7; --ink: #1d2733; --muted: #6b7785; --line: #e3e8ee; --bg: #f5f7fa; --red: #c62828; --green: #2e7d32; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
           padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--blue); color: #fff; }
  header h1 { font-size: 19px; margin: 0; font-weight: 600; }
  button { font: inherit; cursor: pointer; }
  .icon { background: none; border: 0; color: #fff; font-size: 22px; padding: 2px 6px; }
  main { flex: 1; padding: 12px 12px 96px; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; padding: 8px 0 6px; color: var(--muted); display: flex; flex-direction: column;
               align-items: center; font-size: 12px; position: relative; }
  nav button.on { color: var(--blue); font-weight: 600; }
  nav .glyph { font-size: 20px; line-height: 1.2; }
  nav .count { position: absolute; top: 4px; left: 55%; background: var(--red); color: #fff; border-radius: 9px; font-size: 11px;
               padding: 0 6px; }
  .message { margin: 10px 12px 0; padding: 10px 12px; border-radius: 8px; background: #e8f0fb; }
  .message.error { background: #fdecea; color: var(--red); }
  .message.ok { background: #e8f5e9; color: var(--green); }
  .as-of { color: var(--muted); font-size: 13px; margin: 4px 4px 10px; }
  .badge { color: #b26a00; }
  .group { background: #fff; border-radius: 12px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .group h2, main > div > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
             margin: 0; padding: 10px 14px 4px; font-weight: 600; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; padding: 9px 14px; border-top: 1px solid var(--line); }
  .row .own { grid-column: 2; font-size: 12px; color: var(--muted); text-align: right; }
  .row.depth1 .name { padding-left: 16px; } .row.depth2 .name { padding-left: 32px; } .row.depth3 .name { padding-left: 48px; }
  .row.depth1, .row.depth2, .row.depth3 { font-size: 15px; color: #3a4654; }
  .row.closed { opacity: .5; }
  .row.total { background: #fff; border-radius: 12px; font-weight: 700; border: 0; }
  .amount { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .negative { color: var(--red); }
  .empty { color: var(--muted); text-align: center; padding: 24px 12px; }
  form.entry { background: #fff; border-radius: 12px; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  form.entry label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; font-size: 17px; padding: 10px; border: 1px solid #cfd7e0; border-radius: 8px; background: #fff;
                  color: var(--ink); width: 100%; }
  #amount { font-size: 22px; font-weight: 600; }
  .kinds { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; }
  .kinds button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; color: var(--muted); }
  .kinds button.on { background: #fff; color: var(--blue); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .primary { background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 13px; font-weight: 600; font-size: 17px; }
  .item { display: flex; justify-content: space-between; gap: 10px; background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .item .what { display: flex; flex-direction: column; font-size: 14px; color: var(--muted); min-width: 0; }
  .item .what b { color: var(--ink); font-size: 16px; }
  .item .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .small { border: 1px solid #cfd7e0; background: #fff; border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--ink); }
  .warn { color: #b26a00; } .error-text { color: var(--red); } h2.refused { color: var(--red) !important; }
  .comment { font-style: italic; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { start } from "./app.js";
  start();
</script>
</body>
</html>
