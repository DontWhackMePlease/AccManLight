<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Accounts">
<title>Account Manager Light</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --blue: #4a90e2; --ink: #ffffff; --muted: #b3b9c2; --line: rgba(255,255,255,.10); --bg: #2d2d2d; --bar: #000000;
          --card: rgba(255,255,255,.07); --field: rgba(0,0,0,.35); --red: #ff6b6b; --green: #6fcf7a; --orange: #f0a040; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
  /* The picture in watermark, still behind the screens (it does not move with them). */
  body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
                 background: url("watermark.jpg") center top / cover no-repeat; opacity: .28; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
           padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bar); color: #fff; }
  header h1 { font-size: 19px; margin: 0; font-weight: 600; }
  button { font: inherit; cursor: pointer; }
  .icon { background: none; border: 0; color: #fff; font-size: 22px; padding: 2px 6px; }
  main { flex: 1; padding: 12px 12px 96px; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2; display: flex; background: var(--bar); border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; padding: 8px 0 6px; color: var(--muted); display: flex; flex-direction: column;
               align-items: center; font-size: 12px; position: relative; }
  nav button.on { color: #fff; font-weight: 600; }
  nav .glyph { font-size: 20px; line-height: 1.2; }
  nav .count { position: absolute; top: 4px; left: 55%; background: var(--red); color: #fff; border-radius: 9px; font-size: 11px;
               padding: 0 6px; }
  .message { margin: 10px 12px 0; padding: 10px 12px; border-radius: 8px; background: rgba(74,144,226,.18); }
  .message.error { background: rgba(255,107,107,.16); color: var(--red); }
  .message.ok { background: rgba(111,207,122,.16); color: var(--green); }
  .as-of { color: var(--muted); font-size: 13px; margin: 4px 4px 10px; }
  .badge { color: var(--orange); }
  .group { background: var(--card); border-radius: 12px; margin-bottom: 12px; overflow: hidden;
           backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  .group h2, main > div > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
             margin: 0; padding: 10px 14px 4px; font-weight: 600; }
  .group h2.group-head { display: flex; justify-content: space-between; align-items: baseline; cursor: pointer;
                         padding-bottom: 8px; -webkit-tap-highlight-color: rgba(44,111,183,.12); }
  .group.folded h2.group-head { padding-bottom: 10px; }
  .group-total { text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--ink); font-weight: 600;
                 font-variant-numeric: tabular-nums; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; padding: 9px 14px; border-top: 1px solid var(--line); }
  .row .own { grid-column: 2; font-size: 12px; color: var(--muted); text-align: right; }
  .row .name { display: flex; align-items: baseline; }
  .chevron { display: inline-block; width: 18px; flex: none; color: var(--muted); font-size: 13px; }
  .row.node { cursor: pointer; -webkit-tap-highlight-color: rgba(44,111,183,.12); }
  .row.node:active { background: rgba(255,255,255,.08); }
  .row.depth1 .name { padding-left: 18px; } .row.depth2 .name { padding-left: 36px; } .row.depth3 .name { padding-left: 54px; }
  .row.depth1, .row.depth2, .row.depth3 { font-size: 15px; color: #dfe3e8; }
  .row.closed { opacity: .5; }
  .row.total { background: var(--card); border-radius: 12px; font-weight: 700; border: 0; }
  .amount { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .negative { color: var(--red); }
  .empty { color: var(--muted); text-align: center; padding: 24px 12px; }
  form.entry { background: var(--card); border-radius: 12px; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  form.entry label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; font-size: 17px; padding: 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px;
                  background: var(--field); color: var(--ink); width: 100%; color-scheme: dark; }
  select option { background: #2d2d2d; color: #fff; }
  #amount { font-size: 22px; font-weight: 600; }
  .kinds { display: flex; background: rgba(0,0,0,.35); border-radius: 10px; padding: 3px; gap: 3px; }
  .kinds button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; color: var(--muted); }
  .kinds button.on { background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
  .primary { background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 13px; font-weight: 600; font-size: 17px; }
  .item { display: flex; justify-content: space-between; gap: 10px; background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .item .what { display: flex; flex-direction: column; font-size: 14px; color: var(--muted); min-width: 0; }
  .item .what b { color: var(--ink); font-size: 16px; }
  .item .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .small { border: 1px solid rgba(255,255,255,.25); background: transparent; border-radius: 8px; padding: 4px 10px; font-size: 13px;
           color: var(--ink); }
  .warn { color: var(--orange); } .error-text { color: var(--red); } h2.refused { color: var(--red) !important; }
  .comment { font-style: italic; }
  .version { color: var(--muted); font-size: 12px; text-align: center; margin: 8px 0 0; }
  /* The start page: the picture over everything, then it fades out once the app is ready. */
  #splash { position: fixed; inset: 0; z-index: 100; background: #0b1a2a url("splash.jpg") center / cover no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            padding-bottom: calc(48px + env(safe-area-inset-bottom)); transition: opacity 1s ease; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash .name { color: #fff; font-size: 24px; font-weight: 600; letter-spacing: .5px; text-shadow: 0 2px 8px #000; }
  #splash .version { color: #cfd8e3; text-shadow: 0 1px 4px #000; }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="name">Account Manager Light</div><div class="version" id="splash-version"></div></div>
<div id="app"></div>
<script type="module">
  import { start } from "./app.js?v=0.76.1";  // the version in the address: a new one is always fetched
  start();
</script>
</body>
</html>
